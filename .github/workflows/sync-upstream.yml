name: Sync upstream mirror

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror upstream branches and tags
        env:
          # Push with the workflow's own GITHUB_TOKEN, not SYNC_TOKEN: a user PAT without the
          # `workflow` scope is refused on every ref whose tree creates/updates .github/workflows/*
          # (promptfoo: all 1,559 refs). GITHUB_TOKEN (contents: write above) is not subject to that rule.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git clone --bare https://github.com/promptfoo/promptfoo.git upstream.git
          cd upstream.git
          MIRROR="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git for-each-ref --format='%(refname)' refs/heads refs/tags | sed 's/.*/+&:&/' | xargs -r -n 40 git push "$MIRROR"

      - name: Sync fork samir2015dzh/promptfoo via merge-upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          status=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/samir2015dzh/promptfoo/merge-upstream \
            -d '{"branch":"main"}')
          echo "HTTP ${status}"
          cat resp.json
          if [ "${status}" != "200" ]; then
            echo "merge-upstream failed for samir2015dzh/promptfoo (main)"
            exit 1
          fi
